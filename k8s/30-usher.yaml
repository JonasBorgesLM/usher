# usher: the authorization server and the gateway, one binary (ADR-0001,
# ADR-0022 decision 2), behind k3s's Traefik ingress controller.
#
# The load-bearing settings, and why each one is load-bearing, are in
# .claude/rules/k8s-deploy.md. The two that break silently are the
# NetworkPolicy at the bottom of this file and the shutdown arithmetic on
# terminationGracePeriodSeconds.
apiVersion: v1
kind: ConfigMap
metadata:
  name: usher-config
  namespace: usher
data:
  USHER_ADDR: ":8080"
  # The address the host reaches the ingress at (k3d's port mapping in
  # k8s/up.sh). It is also what moat's CSRF Origin check and every
  # token's `iss` are compared against, so it must be the URL a browser
  # (or scripts/dev-access-token.sh) actually uses.
  USHER_ISSUER: "http://localhost:18080"
  USHER_REDIS_ADDR: "redis:6379"
  USHER_CLIENTS_PATH: /etc/usher/clients.json
  USHER_KEYS_DIR: /keys
  # ADR-0022 decision 3: the pod CIDR (k3s default), because the ingress
  # controller's pod IP changes on every reschedule. This range is sound
  # ONLY because of the NetworkPolicy below, which admits nothing but the
  # ingress controller. Never 0.0.0.0/0 (ADR-0010).
  USHER_TRUSTED_PROXY_CIDRS: "10.42.0.0/16"
  USHER_API_UPSTREAM_URL: "http://resource-server:8081"
  USHER_API_UPSTREAM_AUDIENCE: "https://resource-server.usher.local"
  # ADR-0023: each replica's own audit log, vault and spool, on its own
  # volume (the StatefulSet's volumeClaimTemplates below). The signer key
  # file is per pod, named by the pod, in the env below.
  USHER_TALLY_LOG_DIR: /audit/log
  USHER_TALLY_VAULT_DIR: /audit/vault
  USHER_TALLY_ANCHOR_DIR: /audit/anchor
  USHER_TALLY_KEK_FILE: /audit-keys/kek
---
# Headless: the StatefulSet's governing Service, which gives each pod its
# stable name (usher-0, usher-1). Traffic goes through `usher` above.
apiVersion: v1
kind: Service
metadata:
  name: usher-replicas
  namespace: usher
spec:
  clusterIP: None
  selector:
    app: usher
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: usher
  namespace: usher
spec:
  selector:
    app: usher
  ports:
    - port: 8080
      targetPort: 8080
---
# No host rule: every request reaching the ingress goes to usher. That is
# also what lets the resource server fetch the JWKS through the ingress
# (40-resource-server.yaml) instead of needing a hole in the
# NetworkPolicy below.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: usher
  namespace: usher
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: usher
                port:
                  number: 8080
---
# A StatefulSet, not a Deployment, since ADR-0023 (ADR-0022's amendment,
# #165): each replica has its own audit log, vault and signing key, whose
# name is that replica's origin, so a pod needs a stable identity and a
# volume that survives it. Everything else is still shared through Postgres
# and Redis (ADR-0022's table).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: usher
  namespace: usher
spec:
  serviceName: usher-replicas
  # Two replicas share everything through Postgres and Redis (ADR-0022's
  # table). The bastion breaker is the exception: it is per replica, so a
  # failed upstream sees up to 2 × the threshold before both open
  # (decision 8, accepted). The audit log is the other: one per replica.
  # k8s/up.sh generates one signing key per ordinal; scaling past it starts
  # a pod with no key, which refuses to start (RNF-05).
  replicas: 2
  # Pods start together; their order carries no meaning.
  podManagementPolicy: Parallel
  # One pod at a time, the new one Ready before the next is replaced: the
  # Deployment's maxUnavailable 0 / maxSurge 1 has no StatefulSet
  # equivalent (a pod's name and volume cannot exist twice), so the second
  # replica carries the traffic while the first restarts.
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: usher
  template:
    metadata:
      labels:
        app: usher
    spec:
      # 30 > preStop sleep (5) + shutdownDrainDeadline (10, cmd/usher/main.go)
      # + headroom for the request in flight. Raising either number
      # without raising this one drops requests during a rollout, silently.
      terminationGracePeriodSeconds: 30
      securityContext:
        # The image runs as USER 65532 (ADR-0022 decision 7); runAsNonRoot
        # can verify it only because the UID is numeric. fsGroup is what
        # makes the keyset Secret below readable by that user.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        # Only on first mount. The default, Always, re-applies group rwx to
        # every file on every start, and tally's file store refuses a log
        # directory looser than 0700 (seen: usher-0 crash-looping on its
        # second start with "/audit/log has mode 0770").
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: usher
          image: usher:dev
          # Side-loaded with `k3d image import`; there is no registry.
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: usher-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Each pod's own key, generated by k8s/up.sh for its ordinal.
            - name: USHER_TALLY_SIGNER_KEY_FILE
              value: /audit-keys/$(POD_NAME).key
            - name: USHER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: usher-secrets
                  key: USHER_DATABASE_URL
            - name: USHER_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: usher-secrets
                  key: REDIS_PASSWORD
            - name: USHER_CSRF_SECRET
              valueFrom:
                secretKeyRef:
                  name: usher-secrets
                  key: USHER_CSRF_SECRET
          lifecycle:
            preStop:
              # usher starts draining the instant SIGTERM arrives, while
              # its endpoint is still leaving the Service. This sleep
              # keeps it serving through that window. It runs `sleep`
              # from the alpine image; a scratch image would need the
              # native sleep action instead.
              exec:
                command: ["sleep", "5"]
          # Migration (advisory lock, ADR-0018), the Redis eviction check
          # and the keyset load all run before usher listens, so
          # connections are refused until then. This probe owns that
          # window, so liveness never kills a pod mid-migration.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            failureThreshold: 60
          # Readiness: Postgres, Redis, a signing key valid now (RNF-10), and
          # an audit log that is not poisoned (ADR-0023). A Redis blip takes
          # the pod out of rotation...
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 2
            failureThreshold: 2
          # ...and does not restart it: liveness checks no dependency.
          # Never swap these two routes.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
            - name: clients
              mountPath: /etc/usher
              readOnly: true
            - name: audit-keys
              mountPath: /audit-keys
              readOnly: true
            # The only writable path: the audit log, vault and spool.
            # readOnlyRootFilesystem stands.
            - name: audit
              mountPath: /audit
      volumes:
        # ADR-0022 decision 4. usher reads the keyset once, at startup:
        # rotating means adding the next key here with a future sign_from,
        # then `kubectl rollout restart`. Updating the Secret alone
        # changes nothing.
        - name: keys
          secret:
            secretName: usher-keys
            defaultMode: 0440
        - name: clients
          configMap:
            name: usher-clients
        # Every replica's signer key and the KEK, generated by k8s/up.sh.
        # Base64, not encryption, like every Secret in this cluster.
        - name: audit-keys
          secret:
            secretName: usher-audit-keys
            defaultMode: 0440
  # The audit volume outlives its pod: a restarted usher-0 reopens its own
  # log. On k3s's local-path provisioner it is still a directory on the
  # node, and the spool in it protects nothing until something off the
  # host pulls from it, which this disposable cluster does not run
  # (tally's README, "Anchoring off the host").
  volumeClaimTemplates:
    - metadata:
        name: audit
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 256Mi
---
# ADR-0022 decision 3. This policy is part of the trust configuration,
# not hardening on top of it: USHER_TRUSTED_PROXY_CIDRS trusts the whole
# pod CIDR, and this is what narrows "any pod" to "the ingress controller".
# Loosen it and any pod can forge X-Forwarded-For, with nothing failing.
# k8s/rollout-test.sh verifies it is enforced before measuring anything.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: usher-ingress-only-from-traefik
  namespace: usher
spec:
  podSelector:
    matchLabels:
      app: usher
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
