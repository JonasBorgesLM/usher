# #118's live check: the same run as sapper-fault-injection.yaml, but the
# injector answers 502 instead of dropping the connection. Before #118 an
# answered failure never reached bastion as one, so the breaker stayed
# closed. The injected status is 502, NOT 503, on purpose: a 503 the client
# sees can then only be the gateway's own open-circuit answer, so
# status_seen: 503 measures the breaker and nothing else.
#
# Same operational requirement as sapper-fault-injection.yaml: usher's
# USHER_API_UPSTREAM_URL must point at profile.listen for the run.
name: usher-gateway-fault-injection-error-502
profile:
  type: fault-injection
  baseline_concurrency: 2
  baseline_duration: 40s
  concurrency: 3           # the faulted phase's load
  duration: 20s             # the faulted phase's length
  upstream: http://localhost:8081   # the real resource-server, reachable from the host
  listen: 0.0.0.0:19200             # usher's own upstream is pointed here for the run
  fault_kind: error
  fault_status: 502
request:
  method: GET
  path: /api/widgets
  headers:
    # FR-10: expanded from the environment, never committed as a literal
    # value. A fresh access_token from the real authorization_code flow,
    # scope "openid widgets:read" (see the report's own token step).
    Authorization: "Bearer ${ACCESS_TOKEN}"
slos:
  status_seen: 503        # the breaker's own fast-fail status (RI-02 rule 1)
  # "It recovers" (RI-02): the after-phase is serving 200 again. A breaker
  # stuck open scores 0% and fails; it is the one SLO here that catches that
  # (sapper#57, #145). The fraction counts REQUESTS, not time: the after-phase
  # starts with the breaker still open (10 s of 40 s), and its 503s are ~10x
  # faster than real 200s, so they are over-counted -- five runs measured
  # 54.9-58.3% for a phase that is ~75% healthy by time. 0.2 leaves that
  # margin; 0.5 sat right on it.
  recovered_status:
    status: 200
    min_fraction: 0.2
  # 3.0, not 1.5 (#145): post/pre p99 ratios measured 0.63-1.92 in BOTH
  # fault kinds at a ~3-6 ms baseline on Docker Desktop, from latency spikes
  # present in every phase -- 1.5 sat inside the noise and failed at random.
  # Latency only: a breaker stuck open answers fast 503s and would pass this;
  # recovered_status above is what catches that.
  recovery_within: 3.0    # coarse guard: a gross post-fault slowdown only
