# The audit log's anchor, for scripts/demo-audit.sh (#173, ADR-0023,
# JonasBorgesLM/tally#55). An overlay on docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up
#
# The anchor recipe from tally's README, "Pull over rsync from another
# machine", on one machine:
#
# - `spool` is the host's side. It serves usher's spool, read-only, over SSH,
#   to one key, and that key may only run `rrsync -ro` on the spool. It holds
#   no credential to anything else.
# - `anchor` is the other machine's side. It pulls with `rsync
#   --ignore-existing` into a volume no host container mounts, so nothing on
#   the host can rewrite what it has pulled. No -t: each file's time is when
#   it arrived, which the host cannot set (tally's RUNBOOK, "Monitoring off
#   the host").
#
# The separation is containers, not machines: whoever has root on this
# Docker host has the anchor volume too. The real demo anchor is a second
# machine (a Raspberry Pi in tally's REQUIREMENTS §16), where that is not so;
# the README's "End to end" section gives its commands.
#
# The SSH key pair is generated by scripts/demo-audit.sh into $DEMO_SSH_DIR.

services:
  spool:
    # uid 65532 is usher's (ADR-0022), which owns the spool's files: rrsync
    # runs as that user to read them, and the account is unlocked for key
    # logins only (no password is ever set).
    build:
      dockerfile_inline: |
        FROM alpine:3.20
        RUN apk add --no-cache openssh-server rsync rrsync && ssh-keygen -A \
         && adduser -D -u 65532 -s /bin/sh puller \
         && sed -i 's/^puller:!/puller:*/' /etc/shadow
    command:
      - sh
      - -c
      - >-
        mkdir -p /home/puller/.ssh &&
        printf 'command="rrsync -ro /audit/anchor",restrict %s\n' "$$(cat /keys/anchor.pub)" > /home/puller/.ssh/authorized_keys &&
        chown -R puller /home/puller/.ssh && chmod 700 /home/puller/.ssh && chmod 600 /home/puller/.ssh/authorized_keys &&
        exec /usr/sbin/sshd -D -e -o PasswordAuthentication=no -o PermitRootLogin=no
    volumes:
      # usher's audit volume, read-only: the spool is the only path served.
      - usher-audit:/audit:ro
      - ${DEMO_SSH_DIR:?run scripts/demo-audit.sh, which sets DEMO_SSH_DIR}/anchor.pub:/keys/anchor.pub:ro
    networks:
      usher:
    healthcheck:
      test: ["CMD", "pgrep", "sshd"]
      interval: 2s
      timeout: 2s
      retries: 15

  anchor:
    build:
      dockerfile_inline: |
        FROM alpine:3.20
        RUN apk add --no-cache openssh-client rsync
    # Idle; scripts/demo-audit.sh runs each pull with `docker compose exec`.
    command: ["sleep", "infinity"]
    volumes:
      - anchor-copy:/anchor
      - ${DEMO_SSH_DIR}/anchor:/keys/anchor:ro
    networks:
      usher:
    depends_on:
      spool:
        condition: service_healthy

volumes:
  anchor-copy:
